name: Radar Winamax

on:
  schedule:
    # Horas en UTC (2 ejecuciones al día: 10:23 y 18:23 en horario de verano España; 09:23 y 17:23 en invierno).
    # Se evita el minuto :00 porque GitHub retrasa o se salta más ejecuciones a las horas en punto.
    - cron: "23 8,16 * * *"
  workflow_dispatch:
    inputs:
      resumen:
        description: "Enviar mensaje de prueba aunque no haya avisos"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Ejecutar bot
        run: python bot_winamax.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
          ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BANKROLL: ${{ vars.BANKROLL || '1000' }}
          RESUMEN: ${{ github.event.inputs.resumen }}

      - name: Guardar estado (evita avisos repetidos)
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add estado.json apuestas.json
          git diff --cached --quiet || (git commit -m "Actualizar estado" && git push)
